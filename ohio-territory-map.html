<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORHA — Ohio Territory Map</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --t1:#003479;--t2:#8320cb;--t3:#f19321;--t4:#ce3929;
    --t1-light:#336ba6;--t2-light:#a85dda;--t3-light:#f5b160;--t4-light:#de6e63;
    --bg:#f8f9fa;--panel-bg:#ffffff;--text:#1e293b;--text-muted:#64748b;
    --border:#e2e8f0;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  }
  html{font-size:16px}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

  /* HEADER */
  .header{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:20}
  .header-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .header-brand .logo{width:36px;height:36px;background:var(--t1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
  .header-brand h1{font-size:1.1rem;font-weight:700;color:var(--text);white-space:nowrap}
  .header-brand h1 span{color:var(--text-muted);font-weight:400;font-size:.85rem;margin-left:6px}

  /* SEARCH */
  .search-wrap{position:relative;flex:1;max-width:340px;min-width:200px;margin-left:auto}
  .search-wrap input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:var(--radius);font-size:.875rem;outline:none;transition:border .2s}
  .search-wrap input:focus{border-color:var(--t1)}
  .search-wrap .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
  .search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);max-height:240px;overflow-y:auto;display:none;z-index:100;box-shadow:var(--shadow-lg)}
  .search-results.open{display:block}
  .search-results .sr-item{padding:8px 12px;cursor:pointer;font-size:.875rem;display:flex;justify-content:space-between;align-items:center}
  .search-results .sr-item:hover,.search-results .sr-item.active{background:#f1f5f9}
  .search-results .sr-item .sr-territory{font-size:.75rem;color:var(--text-muted)}

  /* MAIN LAYOUT */
  .main{display:flex;flex:1;overflow:hidden;position:relative}
  .map-container{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
  .map-svg-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
  .map-svg-wrap svg{display:block;width:100%;height:100%}

  /* CONTROLS */
  .map-controls{position:absolute;bottom:16px;left:16px;display:flex;gap:8px;z-index:10}
  .map-controls button{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;font-size:.8rem;cursor:pointer;box-shadow:var(--shadow);transition:background .15s}
  .map-controls button:hover{background:#f1f5f9}
  .map-controls button svg{vertical-align:middle;margin-right:4px}

  /* LEGEND */
  .legend{background:#fff;border-top:1px solid var(--border);padding:10px 20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:.8rem}
  .legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .legend-swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}

  /* INFO PANEL */
  .info-panel{width:320px;background:var(--panel-bg);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s ease,opacity .3s ease;z-index:15;flex-shrink:0}
  .info-panel.collapsed{transform:translateX(100%);position:absolute;right:0;top:0;bottom:0;opacity:0;pointer-events:none}
  .info-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .info-panel-header h2{font-size:.95rem;font-weight:600}
  .info-panel-close{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1.2rem;padding:4px;line-height:1}
  .info-panel-close:hover{color:var(--text)}
  .info-panel-body{padding:20px;flex:1;overflow-y:auto}
  .info-panel-body .ip-empty{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:.9rem;line-height:1.6}
  .ip-county-name{font-size:1.4rem;font-weight:700;margin-bottom:4px}
  .ip-territory-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:600;color:#fff;margin-bottom:16px}
  .ip-section{margin-bottom:20px}
  .ip-section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px;font-weight:600}
  .ip-manager-name{font-size:1.05rem;font-weight:600}
  .ip-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px}
  .ip-actions button{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.825rem;transition:background .15s}
  .ip-actions button:hover{background:#f1f5f9}
  .ip-actions button.copied{background:#ecfdf5;border-color:#86efac;color:#166534}

  /* TOOLTIP */
  .tooltip{position:fixed;pointer-events:none;background:rgba(15,23,42,.92);color:#fff;padding:8px 12px;border-radius:6px;font-size:.8rem;line-height:1.4;z-index:1000;max-width:220px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .12s}
  .tooltip.visible{opacity:1}
  .tooltip .tt-county{font-weight:600;font-size:.85rem}
  .tooltip .tt-territory{color:#cbd5e1;font-size:.75rem}

  /* MOBILE */
  @media(max-width:768px){
    .header{padding:10px 14px;gap:10px}
    .header-brand h1{font-size:.95rem}
    .header-brand h1 span{display:none}
    .search-wrap{max-width:100%;min-width:0;margin-left:0;flex-basis:100%;order:3}
    .main{flex-direction:column}
    .info-panel{width:100%;border-left:none;border-top:1px solid var(--border);max-height:45vh;position:relative}
    .info-panel.collapsed{transform:translateY(100%);position:absolute;bottom:0;left:0;right:0;top:auto}
    .legend{padding:8px 14px;gap:12px;font-size:.7rem}
    .legend-swatch{width:12px;height:12px}
  }

  /* LOADING */
  .loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
  .loading-overlay .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--t1);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay.hidden{display:none}

  /* COUNTY PATH STYLES */
  .county-path{stroke:#fff;stroke-width:.7;cursor:pointer;transition:fill .15s,stroke-width .15s}
  .county-path:hover{stroke-width:2;filter:brightness(1.12)}
  .county-path.selected{stroke:#1e293b;stroke-width:2.5;filter:brightness(1.08)}
  .county-path.search-highlight{stroke:#ef4444;stroke-width:3;filter:brightness(1.15)}

  /* COUNTY LABELS */
  .county-label{font-size:3.2px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:.5px;stroke-linejoin:round}
</style>
</head>
<body>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tt-county"></div>
  <div class="tt-territory"></div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="header-brand">
    <div class="logo">OH</div>
    <h1>Ohio Territory Map<span>Ohio Restaurant &amp; Hospitality Alliance</span></h1>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search county…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</header>

<!-- MAIN -->
<div class="main">
  <!-- MAP -->
  <div class="map-container">
    <div class="map-svg-wrap" id="mapWrap">
      <div class="loading-overlay" id="loader"><div class="spinner"></div></div>
      <svg id="mapSvg"></svg>
      <div class="map-controls">
        <button id="btnReset" title="Reset view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Reset View
        </button>
        <button id="btnZoomIn" title="Zoom in">+</button>
        <button id="btnZoomOut" title="Zoom out">−</button>
      </div>
    </div>
    <!-- LEGEND -->
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--t1)"></div><strong>T1</strong> Matt Hedden</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--t2)"></div><strong>T2</strong> Brendan Scott</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--t3)"></div><strong>T3</strong> Nicole Fracasso</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--t4)"></div><strong>T4</strong> Lauren Simon</div>
    </div>
  </div>

  <!-- INFO PANEL -->
  <aside class="info-panel collapsed" id="infoPanel">
    <div class="info-panel-header">
      <h2>County Details</h2>
      <button class="info-panel-close" id="panelClose" title="Close panel">&times;</button>
    </div>
    <div class="info-panel-body" id="panelBody">
      <div class="ip-empty">Click a county on the map to view details.</div>
    </div>
  </aside>
</div>

<!-- LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
(function(){
  "use strict";

  /* ──────────────────── DATA ──────────────────── */
  const territoryToManager = {
    T1: "Matt Hedden",
    T2: "Brendan Scott",
    T3: "Nicole Fracasso",
    T4: "Lauren Simon"
  };

  const territoryColors = { T1: "#003479", T2: "#8320cb", T3: "#f19321", T4: "#ce3929" };
  const unassignedColor = "#cbd5e1";

  // Authoritative county → territory mapping
  const countyToTerritory = {};
  const raw = {
    T1: ["Delaware","Franklin","Licking","Fairfield","Perry","Hocking","Athens","Muskingum","Morgan","Washington"],
    T2: ["Williams","Defiance","Paulding","Van Wert","Mercer","Shelby","Auglaize","Allen","Putnam","Henry","Fulton","Lucas","Wood","Hancock","Hardin","Logan","Marion","Wyandot","Seneca","Sandusky","Ottawa","Erie","Huron","Crawford","Morrow","Knox","Richland","Ashland","Wayne","Holmes","Coshocton"],
    T3: ["Miami","Champaign","Union","Preble","Montgomery","Clark","Madison","Greene","Fayette","Clinton","Pickaway","Warren","Butler","Ross","Hamilton","Clermont","Brown","Highland","Adams","Scioto","Lawrence","Jackson","Gallia","Pike","Vinton","Meigs","Darke"],
    T4: ["Ashtabula","Lake","Geauga","Cuyahoga","Summit","Portage","Trumbull","Mahoning","Columbiana","Stark","Tuscarawas","Carroll","Jefferson","Harrison","Belmont","Monroe","Noble","Guernsey","Lorain","Medina"]
  };
  for (const [t, counties] of Object.entries(raw)) {
    for (const c of counties) countyToTerritory[normalize(c)] = t;
  }

  /* Normalization: trim, lowercase, handle St./Saint */
  function normalize(name) {
    return (name || "").trim().toLowerCase()
      .replace(/\bsaint\b/g, "st.")
      .replace(/\bst\b(?!\.)/g, "st.");
  }

  function lookupTerritory(name) {
    return countyToTerritory[normalize(name)] || null;
  }

  /* ──────────────────── DOM REFS ──────────────────── */
  const svg = d3.select("#mapSvg");
  const tooltip = document.getElementById("tooltip");
  const loader = document.getElementById("loader");
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  const infoPanel = document.getElementById("infoPanel");
  const panelBody = document.getElementById("panelBody");
  const panelClose = document.getElementById("panelClose");
  const btnReset = document.getElementById("btnReset");
  const btnZoomIn = document.getElementById("btnZoomIn");
  const btnZoomOut = document.getElementById("btnZoomOut");

  let selectedCounty = null;
  let highlightedCounty = null;
  let allCountyFeatures = [];

  /* ──────────────────── LOAD MAP ──────────────────── */
  const DATA_URL = "https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json";

  d3.json(DATA_URL).then(function(us) {
    const allCounties = topojson.feature(us, us.objects.counties);
    const ohioCounties = {
      type: "FeatureCollection",
      features: allCounties.features.filter(function(d) { return d.id.startsWith("39"); })
    };
    allCountyFeatures = ohioCounties.features;

    // Ohio state mesh for border
    const statesMesh = topojson.mesh(us, us.objects.states, function(a, b) { return a !== b; });
    const ohioState = topojson.feature(us, us.objects.states).features.find(function(d) { return d.id === "39"; });

    buildMap(ohioCounties, ohioState, statesMesh);
    loader.classList.add("hidden");
  }).catch(function(err) {
    loader.innerHTML = '<div style="text-align:center;color:#ef4444;padding:20px"><strong>Failed to load map data.</strong><br><small>' + err.message + '</small></div>';
  });

  /* ──────────────────── BUILD MAP ──────────────────── */
  function buildMap(ohioCounties, ohioState) {
    const wrap = document.getElementById("mapWrap");
    const width = wrap.clientWidth;
    const height = wrap.clientHeight;

    svg.attr("viewBox", "0 0 " + width + " " + height);

    const projection = d3.geoMercator().fitSize([width - 40, height - 40], ohioCounties);
    // Center the fit
    const translate = projection.translate();
    projection.translate([translate[0] + 20, translate[1] + 20]);

    const path = d3.geoPath(projection);

    // Zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([1, 12])
      .on("zoom", function(event) {
        g.attr("transform", event.transform);
      });
    svg.call(zoom);

    const g = svg.append("g");

    // County paths
    g.selectAll(".county-path")
      .data(ohioCounties.features)
      .join("path")
      .attr("class", "county-path")
      .attr("d", path)
      .attr("fill", function(d) {
        var t = lookupTerritory(d.properties.name);
        return t ? territoryColors[t] : unassignedColor;
      })
      .attr("data-county", function(d) { return d.properties.name; })
      .on("mouseenter", function(event, d) { showTooltip(event, d); })
      .on("mousemove", function(event) { moveTooltip(event); })
      .on("mouseleave", hideTooltip)
      .on("click", function(event, d) { selectCounty(d, this); });

    // County labels
    g.selectAll(".county-label")
      .data(ohioCounties.features)
      .join("text")
      .attr("class", "county-label")
      .attr("x", function(d) { return path.centroid(d)[0]; })
      .attr("y", function(d) { return path.centroid(d)[1]; })
      .text(function(d) { return d.properties.name; });

    // State outline
    if (ohioState) {
      g.append("path")
        .datum(ohioState)
        .attr("d", path)
        .attr("fill", "none")
        .attr("stroke", "#475569")
        .attr("stroke-width", 1.5)
        .style("pointer-events", "none");
    }

    /* ── Controls ── */
    btnReset.addEventListener("click", function() {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });
    btnZoomIn.addEventListener("click", function() {
      svg.transition().duration(300).call(zoom.scaleBy, 1.5);
    });
    btnZoomOut.addEventListener("click", function() {
      svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.5);
    });

    /* ── Search zoom-to-county ── */
    window._zoomToCounty = function(countyName) {
      var feature = ohioCounties.features.find(function(f) {
        return normalize(f.properties.name) === normalize(countyName);
      });
      if (!feature) return;
      var [[x0, y0], [x1, y1]] = path.bounds(feature);
      var dx = x1 - x0, dy = y1 - y0;
      var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      var scale = Math.min(8, 0.9 / Math.max(dx / width, dy / height));
      var translate = [width / 2 - scale * cx, height / 2 - scale * cy];
      svg.transition().duration(600).call(
        zoom.transform,
        d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
      );

      // Select it
      var pathEl = g.selectAll(".county-path").filter(function(dd) {
        return normalize(dd.properties.name) === normalize(countyName);
      }).node();
      if (pathEl) selectCounty(feature, pathEl);
    };

    /* ── Responsive resize ── */
    var resizeTimer;
    window.addEventListener("resize", function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        var w = wrap.clientWidth;
        var h = wrap.clientHeight;
        svg.attr("viewBox", "0 0 " + w + " " + h);
        projection.fitSize([w - 40, h - 40], ohioCounties);
        var tr = projection.translate();
        projection.translate([tr[0] + 20, tr[1] + 20]);
        g.selectAll(".county-path").attr("d", path);
        g.selectAll(".county-label")
          .attr("x", function(d) { return path.centroid(d)[0]; })
          .attr("y", function(d) { return path.centroid(d)[1]; });
        g.selectAll("path:last-child").attr("d", path);
        svg.call(zoom.transform, d3.zoomIdentity);
      }, 200);
    });
  }

  /* ──────────────────── TOOLTIP ──────────────────── */
  function showTooltip(event, d) {
    var name = d.properties.name;
    var territory = lookupTerritory(name);
    tooltip.querySelector(".tt-county").textContent = name + " County";
    tooltip.querySelector(".tt-territory").textContent = territory
      ? territory + " — " + territoryToManager[territory]
      : "Unassigned";
    tooltip.classList.add("visible");
    moveTooltip(event);
  }
  function moveTooltip(event) {
    var x = event.clientX + 14;
    var y = event.clientY - 10;
    // Keep within viewport
    var tw = tooltip.offsetWidth;
    var th = tooltip.offsetHeight;
    if (x + tw > window.innerWidth - 8) x = event.clientX - tw - 14;
    if (y + th > window.innerHeight - 8) y = event.clientY - th - 10;
    if (y < 8) y = 8;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hideTooltip() {
    tooltip.classList.remove("visible");
  }

  /* ──────────────────── SELECT COUNTY ──────────────────── */
  function selectCounty(d, pathEl) {
    // Deselect previous
    d3.selectAll(".county-path.selected").classed("selected", false);
    d3.selectAll(".county-path.search-highlight").classed("search-highlight", false);
    // Select new
    d3.select(pathEl).classed("selected", true);
    selectedCounty = d;

    var name = d.properties.name;
    var territory = lookupTerritory(name);
    var manager = territory ? territoryToManager[territory] : "Unassigned";
    var color = territory ? territoryColors[territory] : unassignedColor;

    panelBody.innerHTML =
      '<div class="ip-county-name">' + escHtml(name) + ' County</div>' +
      '<div class="ip-territory-badge" style="background:' + color + '">' +
        '<span>' + (territory || "—") + '</span>' +
      '</div>' +
      '<div class="ip-section">' +
        '<div class="ip-section-label">Membership Manager</div>' +
        '<div class="ip-manager-name">' + escHtml(manager) + '</div>' +
      '</div>' +
      '<div class="ip-actions">' +
        '<button onclick="copyText(\'' + escAttr(name + " County") + '\', this)">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          'Copy county name</button>' +
        '<button onclick="copyText(\'' + escAttr(manager) + '\', this)">'+
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          'Copy manager name</button>' +
      '</div>';

    infoPanel.classList.remove("collapsed");
  }

  function escHtml(s) { var el = document.createElement("span"); el.textContent = s; return el.innerHTML; }
  function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, "&quot;"); }

  panelClose.addEventListener("click", function() {
    infoPanel.classList.add("collapsed");
    d3.selectAll(".county-path.selected").classed("selected", false);
    selectedCounty = null;
  });

  /* ──────────────────── COPY ──────────────────── */
  window.copyText = function(text, btn) {
    navigator.clipboard.writeText(text).then(function() {
      var orig = btn.innerHTML;
      btn.classList.add("copied");
      var label = btn.querySelector("svg").outerHTML + " Copied!";
      btn.innerHTML = label;
      setTimeout(function() {
        btn.classList.remove("copied");
        btn.innerHTML = orig;
      }, 1500);
    });
  };

  /* ──────────────────── SEARCH ──────────────────── */
  var searchOpen = false;

  searchInput.addEventListener("input", function() {
    var q = this.value.trim().toLowerCase();
    if (q.length === 0) {
      closeSearch();
      // Remove search highlights
      d3.selectAll(".county-path.search-highlight").classed("search-highlight", false);
      return;
    }
    var matches = allCountyFeatures
      .filter(function(f) { return f.properties.name.toLowerCase().indexOf(q) !== -1; })
      .sort(function(a, b) { return a.properties.name.localeCompare(b.properties.name); })
      .slice(0, 20);

    searchResults.innerHTML = matches.map(function(f, i) {
      var t = lookupTerritory(f.properties.name);
      return '<div class="sr-item" data-name="' + escAttr(f.properties.name) + '">' +
        '<span>' + highlightMatch(f.properties.name, q) + ' County</span>' +
        '<span class="sr-territory">' + (t ? t + " — " + territoryToManager[t] : "Unassigned") + '</span>' +
        '</div>';
    }).join("");

    if (matches.length > 0) {
      searchResults.classList.add("open");
      searchOpen = true;
    } else {
      searchResults.innerHTML = '<div class="sr-item" style="color:var(--text-muted)">No counties found</div>';
      searchResults.classList.add("open");
      searchOpen = true;
    }
  });

  searchInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      var first = searchResults.querySelector(".sr-item[data-name]");
      if (first) {
        var name = first.getAttribute("data-name");
        searchInput.value = name;
        closeSearch();
        if (window._zoomToCounty) window._zoomToCounty(name);
      }
    }
    if (e.key === "Escape") {
      closeSearch();
      searchInput.blur();
    }
  });

  searchResults.addEventListener("click", function(e) {
    var item = e.target.closest(".sr-item[data-name]");
    if (!item) return;
    var name = item.getAttribute("data-name");
    searchInput.value = name;
    closeSearch();
    if (window._zoomToCounty) window._zoomToCounty(name);
  });

  document.addEventListener("click", function(e) {
    if (!e.target.closest(".search-wrap")) closeSearch();
  });

  function closeSearch() {
    searchResults.classList.remove("open");
    searchOpen = false;
  }

  function highlightMatch(text, q) {
    var idx = text.toLowerCase().indexOf(q);
    if (idx === -1) return escHtml(text);
    return escHtml(text.substring(0, idx)) +
      '<strong>' + escHtml(text.substring(idx, idx + q.length)) + '</strong>' +
      escHtml(text.substring(idx + q.length));
  }
})();
</script>
</body>
</html>
